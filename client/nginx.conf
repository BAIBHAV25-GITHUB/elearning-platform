# Serves the built SPA and proxies the API, so the browser sees ONE origin (no CORS, simple CSP).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Videos and PDFs are uploaded through the API (MAX_VIDEO_UPLOAD_MB defaults to 4096).
    client_max_body_size 4g;

    # Content-Security-Policy tuned for Razorpay Checkout and Cloudinary media.
    #  - Razorpay: checkout.js is loaded from checkout.razorpay.com, the payment window is an iframe from
    #    api.razorpay.com / checkout.razorpay.com, and it reports to lumberjack.razorpay.com.
    #  - Cloudinary: videos, PDFs (shown in an iframe) and thumbnails come from res.cloudinary.com.
    #  - style-src needs 'unsafe-inline' because React sets style="" attributes and Razorpay injects styles.
    # Written from Razorpay's and Cloudinary's documented hosts; NOT verified against a live checkout. If the
    # payment window or a video is blocked, open the browser console: it names the blocked host.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://checkout.razorpay.com https://*.razorpay.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://res.cloudinary.com https://*.razorpay.com; media-src 'self' blob: https://res.cloudinary.com; font-src 'self' data:; connect-src 'self' https://*.razorpay.com https://lumberjack.razorpay.com; frame-src https://api.razorpay.com https://checkout.razorpay.com https://res.cloudinary.com; object-src 'none'; base-uri 'self'; form-action 'self' https://api.razorpay.com; frame-ancestors 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    location /api/ {
        proxy_pass http://server:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # stream big uploads straight to the API instead of buffering them on disk first
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location = /health {
        proxy_pass http://server:5000/health;
    }

    # hashed build assets can be cached for a long time
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Content-Security-Policy "default-src 'self'" always;
        try_files $uri =404;
    }

    # single-page app: unknown paths fall back to index.html (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
